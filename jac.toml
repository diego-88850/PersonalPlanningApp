[project]
name = "PersonalPlanningApp"
default-app = "web"
jac-version = "==0.37.23"

[apps]
[apps.web]
kind = "web-app"
entry-point = "web.main"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"

[apps.mobile.test]
directories = ["core/upkeep"]

[apps.mobile.dependencies]
[apps.mobile.dependencies.npm]
[apps.mobile.dependencies.npm.native]
"@noble/hashes" = "^2.0.1"
expo-web-browser = "~15.0.0"
expo-crypto = "~15.0.0"
expo-font = "~14.0.0"
lucide-react-native = "^0.469.0"
react-native-svg = "^15.13.0"




[apps.cli]
kind = "cli"
entry-point = "cli.main"

[apps.cli.test]
directories = ["."]

[apps.cli.check]
[apps.cli.check.lint]
ignore = ["no-print"]



[apps.server]
kind = "service"
entry-point = "core.server"


[precommit]
typecheck = true

[serve]
[serve.auth]
registration_challenge = true
registration_attempts_per_hour = 5
registration_challenges_per_10_minutes = 20


[test]
directories = ["core", "web", "mobile", "cli"]

[check]
[check.lint]
select = ["all", "strip-comments", "strip-docstrings"]
exclude = [".jac/*"]


[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "orange"
font = "geist"
radius = "default"
menuAccent = "subtle"
menuColor = "default"
components_dir = "core/site/ui"
utils_path = "core/utils.jac"

[dependencies]
[dependencies.npm]
"@noble/hashes" = "^2.0.1"
react-native-web = "^0.21.2"
embla-carousel-react = "*"
"@hugeicons/core-free-icons" = "4.3.3"
"@hugeicons/react" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/geist" = "*"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@fontsource-variable/geist-mono" = "latest"
lucide-react = "^0.469.0"


[client]
[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.assets]
dir = "core/site/assets"
custom_extensions = [".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg", ".ico", ".woff", ".woff2", ".ttf", ".otf", ".eot", ".mp4", ".webm", ".mp3", ".wav", ".css", ".js", ".json"]

[client.app_meta_data]
title = "Upkeep"
description = "A personal tracker for habits, workouts, weekly goals and job applications."
author = "Diego Alonso Coronado"
